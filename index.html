```html
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天吃什么</title>
<style>
body{font-family:system-ui;text-align:center;padding:40px 20px;background:#f7f7f7}
h1{font-size:24px}
#result{font-size:28px;font-weight:bold;margin:30px 0;color:#e67e22}
button{font-size:18px;padding:12px 24px;margin:6px;border:none;border-radius:8px;background:#3498db;color:#fff;cursor:pointer}
button.secondary{background:#95a5a6}
#report{margin-top:20px;color:#555}
</style>
</head>
<body>
<h1>今天吃什么</h1>
<button onclick="roll()">🎲 随机推荐</button>
<div id="result">点击按钮试试</div>
<div>
<button class="secondary" onclick="report('人少先冲')">人少先冲</button>
<button class="secondary" onclick="report('排队别去')">排队别去</button>
<button class="secondary" onclick="share()">复制分享文案</button>
</div>
<div id="report"></div>
<script>
const foods=["一食堂麻辣香锅","二食堂牛肉面","三食堂自选快餐","四食堂黄焖鸡","五食堂螺蛳粉"];
let current="";
function roll(){
 current=foods[Math.floor(Math.random()*foods.length)];
 document.getElementById('result').innerText=current;
 document.getElementById('report').innerText="";
}
function report(type){
 if(!current){alert("先随机推荐一个");return;}
 document.getElementById('report').innerText="已上报："+type+"（"+current+"）";
}
function share(){
 if(!current){alert("先随机推荐一个");return;}
 const text="今天推荐："+current+"，人少先冲！";
 navigator.clipboard.writeText(text).then(()=>alert("已复制："+text)).catch(()=>prompt("手动复制",text));
}
</script>
</body>
</html>
```
