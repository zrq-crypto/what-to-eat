<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>今天吃什么 | 校园干饭王</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #333;
  }
  .container {
    background: white; padding: 30px 20px; border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center; max-width: 420px; width: 100%; margin-top: 20px;
  }
  h1 { font-size: 24px; color: #2c3e50; margin-bottom: 20px; }
  
  .filter-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    background: #f1f2f6; border: none; padding: 8px 16px; border-radius: 20px;
    font-size: 14px; color: #57606f; cursor: pointer; transition: 0.2s;
  }
  .filter-btn.active { background: #2ed573; color: white; font-weight: bold; }

  .result-card {
    background: #fff; padding: 15px; border-radius: 16px; margin: 20px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px dashed #f39c12; transition: all 0.3s ease;
  }
  
  /* 用代码画出来的精美占位图 */
  .food-img-placeholder {
    width: 100%; height: 150px; border-radius: 12px; margin-bottom: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 50px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    background: linear-gradient(135deg, #ccc, #999); /* 默认颜色 */
  }
  .food-img-placeholder span { font-size: 16px; margin-top: 10px; font-weight: bold; }

  /* 不同分类不同颜色 */
  .bg-fan { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
  .bg-mian { background: linear-gradient(135deg, #f6d365 0%, #f39c12 100%); }
  .bg-qingshi { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
  .bg-xican { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }

  .food-name { font-size: 24px; font-weight: bold; color: #e67e22; margin-bottom: 8px; }
  .food-rating { font-size: 14px; color: #f39c12; margin-bottom: 12px; font-weight: bold; }
  
  .food-info { font-size: 13px; color: #7f8c8d; display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center;}
  .tag { background: #ecf0f1; padding: 3px 8px; border-radius: 4px; }
  
  .food-reason { font-size: 14px; color: #d35400; font-style: italic; margin-top: 5px;}

  .btn-main {
    background: #e67e22; color: white; border: none; padding: 16px 32px;
    font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%;
    box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); transition: transform 0.1s;
  }
  .btn-main:active { transform: scale(0.96); }
  
  .action-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .btn-sub { flex: 1; background: #f1f2f6; color: #57606f; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-sub:active { background: #dfe4ea; }
  #report-msg { margin-top: 15px; font-size: 14px; color: #27ae60; height: 20px; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h1>🍜 今天吃什么？</h1>
    
    <div class="filter-group">
      <button class="filter-btn active" onclick="setCategory('all', this)">全部</button>
      <button class="filter-btn" onclick="setCategory('饭', this)">🍚 饭类</button>
      <button class="filter-btn" onclick="setCategory('面', this)">🍜 面食</button>
      <button class="filter-btn" onclick="setCategory('轻食', this)">🥗 健康轻食</button>
      <button class="filter-btn" onclick="setCategory('西餐', this)">🍔 西餐</button>
    </div>

    <div id="result" class="result-card">
      <div class="food-name">点击下方按钮</div>
      <div class="food-info">让命运决定你的午餐</div>
    </div>
    
    <button class="btn-main" onclick="roll()">🎲 随机推荐一家</button>
    
    <div class="action-group">
      <button class="btn-sub" onclick="report('人少先冲')">🙋‍♂️ 人少先冲</button>
      <button class="btn-sub" onclick="report('排队别去')">🏃‍♂️ 排队别去</button>
      <button class="btn-sub" onclick="share()">🔗 分享</button>
    </div>
    <div id="report-msg"></div>
  </div>

<script>
// 各种分类对应的图标和颜色类名
const typeMap = {
  "饭": { icon: "🍚", class: "bg-fan" },
  "面": { icon: "🍜", class: "bg-mian" },
  "轻食": { icon: "🥗", class: "bg-qingshi" },
  "西餐": { icon: "🍔", class: "bg-xican" }
};

const prefixes = ["一食堂", "二食堂", "三食堂", "四食堂", "五食堂", "二楼", "三楼", "小吃街", "南门", "北门", "清真", "教工", "西区", "东区"];
const rices = ["黄焖鸡", "麻辣香锅", "烤肉拌饭", "石锅拌饭", "盖浇饭", "铁板炒饭", "猪脚饭", "鸡公煲", "瓦罐汤套餐", "蛋炒饭", "猪排饭", "咖喱饭"];
const noodles = ["牛肉面", "螺蛳粉", "重庆小面", "过桥米线", "兰州拉面", "炸酱面", "热干面", "刀削面", "酸辣粉", "肥肠面", "担担面"];
const salads = ["轻食沙拉", "水煮鸡胸肉", "全麦三明治", "减脂波奇饭", "蔬菜卷饼", "无糖酸奶碗", "烤南瓜藜麦", "能量牛肉碗"];
const westerns = ["黑椒牛排", "番茄肉酱意面", "经典牛肉汉堡", "炸鸡薯条", "培根披萨", "凯撒沙拉", "总汇三明治", "美式热狗", "芝士焗饭", "奶油蘑菇汤"];
const reasons = ["碳水使我快乐！", "吃完这顿就减肥。", "灵魂汤汁，绝绝子。", "性价比之王，还要啥自行车。", "排了半小时，不好吃也得说好吃。", "建议搭配奶茶食用。", "今天也是自律的一天。", "吃草的一天，感觉身体变轻盈了。", "闻着臭，吃着香！", "肉多管饱，干饭人首选。", "这顿吃完，钱包又瘪了。"];

let foodData = [];

function generateDatabase() {
  let id = 0;
  for (let i = 0; i < 20; i++) {
    rices.forEach(r => foodData.push({ id: id++, name: prefixes[Math.floor(Math.random()*prefixes.length)] + r, type: "饭", price: Math.floor(Math.random()*15)+10, calorie: Math.floor(Math.random()*400)+600, healthy: false, taste: (Math.random()*2+3).toFixed(1), reason: reasons[Math.floor(Math.random()*reasons.length)] }));
    noodles.forEach(n => foodData.push({ id: id++, name: prefixes[Math.floor(Math.random()*prefixes.length)] + n, type: "面", price: Math.floor(Math.random()*12)+9, calorie: Math.floor(Math.random()*300)+500, healthy: false, taste: (Math.random()*2+3).toFixed(1), reason: reasons[Math.floor(Math.random()*reasons.length)] }));
    salads.forEach(s => foodData.push({ id: id++, name: prefixes[Math.floor(Math.random()*prefixes.length)] + s, type: "轻食", price: Math.floor(Math.random()*10)+15, calorie: Math.floor(Math.random()*200)+250, healthy: true, taste: (Math.random()*2+2.5).toFixed(1), reason: reasons[Math.floor(Math.random()*reasons.length)] }));
    westerns.forEach(w => foodData.push({ id: id++, name: prefixes[Math.floor(Math.random()*prefixes.length)] + w, type: "西餐", price: Math.floor(Math.random()*20)+25, calorie: Math.floor(Math.random()*500)+700, healthy: false, taste: (Math.random()*2+3.5).toFixed(1), reason: reasons[Math.floor(Math.random()*reasons.length)] }));
  }
}
generateDatabase(); 

let currentCategory = 'all';
let currentFood = null;

function setCategory(type, btn) {
  currentCategory = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function roll() {
  let pool = foodData;
  if (currentCategory !== 'all') {
    pool = foodData.filter(food => food.type === currentCategory);
  }
  currentFood = pool[Math.floor(Math.random() * pool.length)];
  
  let stars = "";
  if (currentFood.taste >= 4.5) stars = "⭐⭐⭐⭐⭐ (强烈推荐)";
  else if (currentFood.taste >= 4.0) stars = "⭐⭐⭐⭐ (值得一试)";
  else if (currentFood.taste >= 3.5) stars = "⭐⭐⭐ (中规中矩)";
  else stars = "⭐⭐ (踩雷预警)";

  // 获取对应的图标和颜色
  let map = typeMap[currentFood.type];

  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = `
    <div class="food-img-placeholder ${map.class}">
      ${map.icon}
      <span>${currentFood.type}类美食</span>
    </div>
    <div class="food-name">${currentFood.name}</div>
    <div class="food-rating">好评度：${currentFood.taste} 分 ${stars}</div>
    <div class="food-info">
      <span class="tag">¥${currentFood.price}</span>
      <span class="tag">${currentFood.calorie} 大卡</span>
      <span class="tag" style="color:${currentFood.healthy ? '#27ae60' : '#e74c3c'}">
        ${currentFood.healthy ? '健康' : '高热量'}
      </span>
    </div>
    <div class="food-reason">"${currentFood.reason}"</div>
  `;
  document.getElementById('report-msg').innerText="";
}

function report(type) {
 if(!currentFood){alert("先摇一个食堂再说！");return;}
 document.getElementById('report-msg').innerText="✅ 已上报："+type+"（"+currentFood.name+"）";
}

function share() {
 if(!currentFood){alert("先摇一个食堂再说！");return;}
 const text = `今天吃什么？系统推荐我吃【${currentFood.name}】，好评度${currentFood.taste}分，只要¥${currentFood.price}！人少先冲！`;
 navigator.clipboard.writeText(text).then(()=>alert("分享文案已复制！\n\n" + text)).catch(()=>prompt("手动复制",text));
}
</script>
</body>
</html>
