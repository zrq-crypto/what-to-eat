<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>今天吃什么 | 校园食堂版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    color: #333;
  }
  .container {
    background: white;
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  h1 { font-size: 24px; color: #2c3e50; margin-bottom: 20px; }
  .result-card {
    background: #fff3e0;
    color: #e67e22;
    font-size: 28px;
    font-weight: bold;
    padding: 30px 20px;
    border-radius: 16px;
    margin: 20px 0;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    border: 2px dashed #f39c12;
  }
  .btn-main {
    background: #e67e22;
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
    transition: transform 0.1s;
  }
  .btn-main:active { transform: scale(0.96); }
  .action-group {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-sub {
    flex: 1;
    background: #f1f2f6;
    color: #57606f;
    border: none;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .btn-sub:active { background: #dfe4ea; }
  #report-msg { margin-top: 15px; font-size: 14px; color: #27ae60; height: 20px; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h1>🍜 今天吃什么？</h1>
    <div id="result" class="result-card">点击下方按钮，让命运决定你的午餐</div>
    
    <button class="btn-main" onclick="roll()">🎲 随机推荐一家</button>
    
    <div class="action-group">
      <button class="btn-sub" onclick="report('人少先冲')">🙋‍♂️ 人少先冲</button>
      <button class="btn-sub" onclick="report('排队别去')">🏃‍♂️ 排队别去</button>
      <button class="btn-sub" onclick="share()">🔗 分享</button>
    </div>
    <div id="report-msg"></div>
  </div>

<script>
const foods=[
  "一食堂麻辣香锅", "二食堂牛肉面", "三食堂自选快餐", "四食堂黄焖鸡", "五食堂螺蛳粉",
  "沙县小吃", "麻辣烫", "烤肉拌饭", "兰州拉面", "盖浇饭", "水饺", "烤盘饭",
  "铁板炒饭", "石锅拌饭", "酸菜鱼", "瓦罐汤", "自助餐", "手抓饼", "煎饼果子",
  "黄焖鸡米饭", "过桥米线", "重庆小面", "鸡公煲", "炸鸡汉堡", "肠粉", "肉夹馍"
];
let current="";
function roll(){
 current=foods[Math.floor(Math.random()*foods.length)];
 const resultDiv = document.getElementById('result');
 resultDiv.innerText=current;
 resultDiv.style.color = "#e67e22";
 resultDiv.style.background = "#fff3e0";
 document.getElementById('report-msg').innerText="";
}
function report(type){
 if(!current){alert("先摇一个食堂再说！");return;}
 document.getElementById('report-msg').innerText="✅ 已上报："+type+"（"+current+"）";
}
function share(){
 if(!current){alert("先摇一个食堂再说！");return;}
 const text="今天吃什么？系统推荐我吃【"+current+"】，人少先冲！";
 navigator.clipboard.writeText(text).then(()=>alert("分享文案已复制，快去发给同学吧！\n\n" + text)).catch(()=>prompt("手动复制",text));
}
</script>
</body>
</html>
